<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar menu | Uzi Solutions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <div class="main-box">
        <input type="checkbox" id="check">
        <div class="btn-one">
            <label for="check">
                <i class="fas fa-bars"></i>
            </label>
        </div>
        <div class="sidebar-menu">
            <div class="logo">
                <a href="#">Uzi Solutions</a>
            </div>
            <div class="btn-two">
                <label for="check">
                    <i class="fas fa-times"></i>
                </label>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#"><i class="fas fa-qrcode"></i>
                            Dashboard</a></li>
                    <li><a href="#"><i class="fas fa-link"></i>
                            Shortcuts</a></li>
                    <li><a href="#"><i class="fas fa-stream"></i>
                            Overview</a></li>
                    <li><a href="#"><i class="fas fa-calendar-week"></i>
                            Events</a></li>
                    <li><a href="#"><i class="fas fa-sliders-h"></i>
                            Services</a></li>
                    <li><a href="#"><i class="fas fa-question-circle"></i>
                            About</a></li>
                    <li><a href="#"><i class="fas fa-comment"></i>
                            Feedback</a></li>
                </ul>
            </div>

            <div class="social-media">
                <a href="https://www.facebook.com/profile.php?id=61590288941383&_rdc=1&_rdr"><i
                        class="fab fa-facebook-f"></i></a>
                <a href="https://x.com/UziSolutions"><i class="fab fa-twitter"></i></a>
                <a href="https://www.behance.net/uzisolutions"><i class="fab fa-behance"></i></a>
                <a href="https://www.instagram.com/uzisolutions/"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>

</html>
